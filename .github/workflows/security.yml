name: Security Scan & Build Check

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend Dependencies installieren
        run: |
          cd backend
          npm ci

      - name: Frontend Dependencies installieren
        run: |
          cd frontend
          npm ci

      - name: Frontend bauen
        run: |
          cd frontend
          npm run build

      - name: Docker Image bauen (Backend)
        run: |
          cd backend
          docker build -t dmun-backend:latest .

      - name: Docker Image bauen (Frontend)
        run: |
          docker build -t dmun-frontend:latest ./frontend

      - name: Trivy Scanner installieren
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dmun-backend:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Trivy Frontend scannen
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dmun-frontend:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH