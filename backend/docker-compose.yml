services:
  postgres:
    image: postgres:15-alpine
    container_name: dmun_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-munuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-munpassword}
      POSTGRES_DB: ${DB_NAME:-mundb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dmun_network

  backend:
    build: .
    container_name: dmun_backend
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-munuser}:${DB_PASSWORD:-munpassword}@postgres:5432/${DB_NAME:-mundb}"
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - dmun_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: dmun_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - dmun_network

volumes:
  postgres_data:

networks:
  dmun_network:
    driver: bridge