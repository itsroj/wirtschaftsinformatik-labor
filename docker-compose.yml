services:
  # Auskommentiert: Verwenden wir Supabase als Cloud-Datenbank statt lokaler PostgreSQL
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: dmun_postgres
  #   environment:
  #     POSTGRES_USER: ${DB_USER:-munuser}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-munpassword}
  #     POSTGRES_DB: ${DB_NAME:-mundb}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - dmun_network

  backend:
    build: ./backend
    container_name: dmun_backend
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "5000:5000"
    networks:
      - dmun_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dmun_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - dmun_network

  admin:
    build:
      context: ./mun-admin
      dockerfile: Dockerfile
    container_name: dmun_admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - dmun_network

volumes:
  # Auskommentiert: postgres_data nicht mehr nötig (Supabase-Nutzung)
  # postgres_data:

networks:
  dmun_network:
    driver: bridge